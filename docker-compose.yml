services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Stockholm
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"   # ändra till t.ex. "80:80", eller ta bort om du har egen reverse proxy framför
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
